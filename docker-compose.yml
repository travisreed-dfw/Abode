services:
  abode:
    # Prebuilt image from GitHub Releases; `docker compose up -d --build` builds from source instead.
    image: ghcr.io/travisreed-dfw/abode:latest
    build: .
    container_name: abode
    ports:
      # Set HOST_PORT in a .env file next to this file if port 80 is taken on the host.
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./data:/data
      # Optional: let Abode list your other containers as bookmarks (see docs/docker-discovery.md).
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
